name: Feature request
description: Suggest something the application should be able to do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **This issue will be public and permanently visible.** Please leave out personal
        information, and check screenshots for faces, names and file paths.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation rather than the solution. Knowing the actual problem often leads somewhere better than the feature first imagined.
      placeholder: |
        I keep two copies of the same library on different drives and I want to know which
        photos are only in one of them.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: How do you handle it today?
      description: Another program, a manual routine, or not at all.
    validations:
      required: false
